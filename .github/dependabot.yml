# dependabot.yml — Automated dependency updates
# Opens PRs for minor/patch updates only.
# Major version bumps are ignored globally — they require manual migration
# because they typically introduce breaking API changes (e.g. next 14→16,
# react 18→19, vitest 2→5).

version: 2

updates:
  # ── Chrome Extension ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - extension
    # Only auto-bump patch and minor; majors require manual review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Next.js Web Viewer ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web-viewer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web-viewer
    # Same policy: only patch/minor updates automatically.
    # next, react, react-dom, @supabase/* majors all require manual migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    # actions/checkout@v5, actions/setup-node@v5 etc. can have breaking changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
