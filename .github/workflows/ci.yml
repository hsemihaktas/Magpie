# ci.yml — Continuous Integration
# Runs on every pull request and push to main.
# Two parallel jobs: extension (Chrome MV3) and web-viewer (Next.js).
# node_modules are cached via actions/setup-node to keep runs fast.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Extension ──────────────────────────────────────────────────────────────
  extension:
    name: Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Type check (lint)
        run: npm run lint
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension

      - name: Unit tests
        run: npm test
        working-directory: extension

  # ── Web Viewer ─────────────────────────────────────────────────────────────
  web-viewer:
    name: Web Viewer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-viewer

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web-viewer

      - name: Lint
        run: npm run lint
        working-directory: web-viewer
        env:
          # Provide placeholder env vars so Next.js lint pass doesn't fail
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Build
        run: npm run build
        working-directory: web-viewer
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Unit tests
        run: npm test
        working-directory: web-viewer
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
