<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';" />
    <title>Social Content Saver</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #ffffff;
        width: 320px;
        min-height: 200px;
      }

      #app {
        display: flex;
        flex-direction: column;
        min-height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Popup UI is rendered dynamically by popup.ts -->
    </div>
    <script src="popup.js"></script>
  </body>
</html>
